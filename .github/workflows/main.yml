name: Windows Server 2024 System Diagnostics & RDP

on:
  workflow_dispatch: # Allows you to manually trigger the workflow from the Actions tab

jobs:
  diagnose-and-connect:
    runs-on: windows-2025 # Node for modern Windows Server runners (Server 2022/2025/2024 Standard evaluation targets)
    timeout-minutes: 360  # GitHub Actions allows up to 6 hours max per workflow execution

    env:
      NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
      RDP_USER: "DiagnosticAdmin"
      RDP_PASS: "DiagSecurePassw0rd2026!" # Ensure this meets Windows complexity requirements

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Configure RDP Server Settings
      shell: powershell
      run: |
        # 1. Enable Remote Desktop (Clear fDenyTSConnections)
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        
        # 2. Configure Firewall to permit RDP connections
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        
        # 3. Require User Authentication (NLA)
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

    - name: Provision RDP Diagnostic User Account
      shell: powershell
      run: |
        # Create a new local administrator account for the RDP session
        $SecurePassword = ConvertTo-SecureString "$env:RDP_PASS" -AsPlainText -Force
        New-LocalUser -Name "$env:RDP_USER" -Password $SecurePassword -Description "Temporary Diagnostic Admin"
        Add-LocalGroupMember -Group "Administrators" -Member "$env:RDP_USER"
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member "$env:RDP_USER"

    - name: Run Windows System Diagnostics
      shell: powershell
      run: |
        Write-Host "=================== SYSTEM DIAGNOSTICS ==================="
        Write-Host "OS Version Details:"
        Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, OSArchitecture | Format-List
        
        Write-Host "CPU & Hardware Resources:"
        Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, MaxClockSpeed | Format-List
        
        Write-Host "Memory Status:"
        Get-CimInstance Win32_PhysicalMemory | Measure-Object -Property Capacity -Sum | ForEach-Object { "$([Math]::Round($_.Sum / 1GB, 2)) GB Total RAM" }
        
        Write-Host "Storage Diagnostics (Disk Free Space):"
        Get-Volume | Select-Object DriveLetter, FileSystemLabel, SizeRemaining, Size | Format-Table
        
        Write-Host "Active RDP Ports & Listening Connections:"
        Get-NetTCPConnection -LocalPort 3389 -ErrorAction SilentlyContinue | Format-Table
        Write-Host "=========================================================="

    - name: Install and Initialize Ngrok Tunnel
      shell: powershell
      run: |
        # Download and extract Ngrok client
        Invoke-WebRequest -Uri "https://equinox.io" -OutFile "ngrok.zip"
        Expand-Archive -Path "ngrok.zip" -DestinationPath "."
        
        # Authenticate Ngrok
        .\ngrok.exe config add-authtoken "$env:NGROK_AUTH_TOKEN"

    - name: Establish RDP Tunnel & Output Connection Details
      shell: powershell
      run: |
        # Start Ngrok tunnel asynchronously in the background on RDP port 3389
        Start-Process .\ngrok.exe -ArgumentList "tcp 3389" -WindowStyle Hidden
        Start-Sleep -Seconds 7
        
        # Retrieve the public endpoint URL generated by Ngrok
        $NgrokApi = Invoke-RestMethod -Uri "http://127.0.0"
        $PublicUrl = $NgrokApi.tunnels[0].public_url
        $CleanAddress = $PublicUrl.Replace("tcp://", "")
        
        Write-Host "=========================================================="
        Write-Host " RDP REMOTE CONNECTION DETAILS IS READY"
        Write-Host "=========================================================="
        Write-Host " Address  : $CleanAddress"
        Write-Host " Username : $env:RDP_USER"
        Write-Host " Password : $env:RDP_PASS"
        Write-Host "=========================================================="
        Write-Host "Keep this workflow active to stay connected. To terminate, cancel the job."

    - name: Keep Tunnel Alive
      shell: powershell
      run: |
        # Keeps the environment alive up to the runner execution timeout limit
        $count = 0
        while ($count -lt 360) {
            Start-Sleep -Seconds 60
            $count++
        }
